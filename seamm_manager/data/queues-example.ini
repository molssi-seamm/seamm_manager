# An example of the JobServer's queue file. To use it, copy it to
# <root>/<name>.ini -- ~/SEAMM/<hostname>.ini for the default installation on
# this machine -- edit it, and restart the JobServer:
#
#     seamm-manager services restart
#
# Without such a file the JobServer runs every job as a subprocess on this
# machine. Each section below is one queue a job may be sent to; a job picks
# one in the submit dialog, and [DEFAULT] default = names the one used
# otherwise. The full description is in the JobServer's user guide and in the
# SEAMM documentation's how-to "Configure the JobServer's Queues".
#
# A section is copied into each job's directory as target.json, which the web
# interface shows, so never put a secret in this file.

[DEFAULT]
default = local

# This machine, no queueing system: jobs run as subprocesses, at most this
# many at once.
[local]
type = local
max_concurrent_jobs = 4

# This machine's own SLURM (a group server with SLURM installed): each job is
# a real allocation, so SLURM shares the machine among jobs and users.
#[thismachine]
#transport = local
#partition = normal
#ntasks = 4
## Set a memory directive: a site that reserves the whole node's memory per job
## by default would otherwise run one job at a time.
#mem = 10G
#time = 7-00:00:00
#max_concurrent_jobs = 20
#max_resubmits = 3
#
#[thismachine.limits]
#overridable = ntasks, mem, time, gres
#ntasks.max = 64
#mem.max = 500G
#time.max = 7-00:00:00
## Jobs that need a GPU ask for one; no default gres, or every job would wait.
#gres.choices = gpu:1, gpu:2

# A remote SLURM cluster reached over passwordless ssh. The cluster shares no
# filesystem with this machine, so each job's directory is copied to
# remote_root before submission and back when it finishes, and SEAMM on the
# cluster is started by the absolute path of its run_from_jobserver.
#[cluster]
#transport = ssh
#host = cluster
## Rebuild the job's environment as from a fresh login, so codes loaded as
## modules on the cluster are found (our ssh has no login environment).
#export = NONE
#remote_root = /scratch/me/seamm_jobs
#remote_run_from_jobserver = /path/on/cluster/SEAMM/venv/bin/run_from_jobserver
## Submission defaults; match what your account allows. One node type
## (constraint) keeps the timing records consistent.
#account = myaccount
#partition = normal
#qos = normal
#constraint = amd
#nodes = 1
#ntasks = 4
#cpus_per_task = 1
#mem_per_cpu = 2G
#time = 04:00:00
#max_concurrent_jobs = 100
#max_resubmits = 3
#
#[cluster.limits]
#overridable = ntasks, mem_per_cpu, time, qos
#qos.choices = normal, short
#ntasks.max = 256
#mem_per_cpu.max = 16G
#time.max = 7-00:00:00

# The same cluster, with the flowchart as a one-core batch job there and its
# calculations bundled into batch jobs of their own (for flowcharts that
# produce hundreds of independent calculations).
#[cluster_tasks]
#transport = ssh
#host = cluster
#export = NONE
#remote_root = /scratch/me/seamm_jobs
#remote_run_from_jobserver = /path/on/cluster/SEAMM/venv/bin/run_from_jobserver
#account = myaccount
#partition = normal
#qos = short
#constraint = amd
#ntasks = 1
#mem_per_cpu = 8G
#time = 1-00:00:00
#max_concurrent_jobs = 20
#tasks = queue
#scheduler = slurm
#max_queued_tasks = 500
#poll_interval = 60
